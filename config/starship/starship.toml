# Compact prompt
add_newline = false

# Command timeout (ms)
command_timeout = 1000

# Shown modules
format = """$directory$git_branch$golang$nodejs$rust${custom.svelte}$character"""

# Prompt arrow
[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'

# Git branch
[git_branch]
symbol = "\ue702 "
format = '[$symbol$branch(:$remote_branch)]($style) '

# AWS profile
[aws]
format = '[$symbol(profile: "$profile" )(\(region: $region\) )]($style)'
style = 'bold blue'
symbol = "\ue33d "

# Go icon
[golang]
format = "[\ue627 ](bold cyan)"

# Node icon
[nodejs]
detect_folders = ['node_modules', '!.svelte-kit']
format = '[$symbol]($style)'

# Rust icon and version
[rust]
symbol = "\ue7a8 "
format = '[$symbol($version )]($style)'

# Svelte icon
[custom.svelte]
detect_folders = ['.svelte-kit']
symbol = "\ue8b7 "
style = 'bold #ff3e00'
format = '[$symbol]($style)'

# Kubernetes context
[kubernetes]
symbol = '☸ '
format = '[$symbol$context( \($namespace\))]($style) '

# Docker context
[docker_context]
disabled = true
